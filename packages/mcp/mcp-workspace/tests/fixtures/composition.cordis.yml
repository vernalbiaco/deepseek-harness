# Keyless composition for the mcp-workspace Loader composition and end-to-end
# tests: the agent spine, JSONL persistence, local credentials, user questions,
# a scripted model, and the mcp-workspace plugin. Every row loads a `cordis:`
# source builtin, which keeps the tests independent of prebuilt workspace
# artifacts.
- id: llm
  name: cordis:mcp-workspace-test-llm

- id: session
  name: cordis:mcp-workspace-test-session

- id: session-projection
  name: cordis:mcp-workspace-test-session-projection

- id: system-prompt
  name: cordis:mcp-workspace-test-system-prompt

- id: tools
  name: cordis:mcp-workspace-test-tools

- id: agent
  name: cordis:mcp-workspace-test-agent

- id: agent-loop
  name: cordis:mcp-workspace-test-agent-loop
  config:
    agents: []

- id: session-persistence-jsonl
  name: cordis:mcp-workspace-test-session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: credentials
  name: cordis:mcp-workspace-test-credentials
  config:
    watch: false

- id: user-questions
  name: cordis:mcp-workspace-test-user-questions

- id: scripted-model
  name: cordis:mcp-workspace-test-scripted-model

- id: mcp-workspace
  name: cordis:mcp-workspace-test-mcp-workspace
  config:
    trustFile: !!js dshHomePath('mcp-trust.yaml')
