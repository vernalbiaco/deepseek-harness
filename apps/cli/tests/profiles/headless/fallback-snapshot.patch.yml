# Deterministic backup-model failover patch over the shipped headless profile.
# The profile already mounts dsh-llm-retry, so under normal retry mode the
# primary spends its one-retry budget on RATE_LIMIT before the appended
# dsh-llm-fallback entry moves the cursor to the backup route.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-deepseek
  disabled: true

- id: agent-loop
  config:
    agents:
      - id: main
        provider: deepseek-official
        model: deepseek-v4-flash
        cwd: !!js process.cwd()

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none

- insert:
    - id: fallback-snapshot-backend
      name: './tests/fixtures/fallback-snapshot-backend.mjs'
    - id: llm-fallback
      name: '@deepseek-ai/dsh-llm-fallback'
      config:
        backups:
          - provider: deepseek-backup
            model: deepseek-v4-pro
