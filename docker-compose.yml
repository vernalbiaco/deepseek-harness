services:
  headless:
    build:
      context: .
      dockerfile: Dockerfile
    image: dsh:local
    entrypoint: ["node", "/app/apps/cli/lib/bin.js", "--profile", "headless"]
    command: []
    # Direct mode injects no DeepSeek variables. dsh reads the workspace .env
    # itself, and the web Models page owns the DeepSeek key in the credential
    # store, so the card stays writable; a launch-environment value would shadow
    # it read-only. The gateway overlay (docker-compose.omni-wire.yml) sets
    # DEEPSEEK_BASE_URL and DEEPSEEK_API_KEY here for gateway mode only.
    volumes:
      - dsh-home:/root/.dsh
      # The invoking directory is the agent's default workspace root.
      # Point DSH_WORKSPACE at another project to run tasks against it, e.g.:
      #   DSH_WORKSPACE=/path/to/project docker compose run --rm headless "..."
      - ${DSH_WORKSPACE:-.}:/workspace
      # Extra project checkouts the agent may be pointed at, kept out of the
      # default workspace root.
      - ./workspaces:/workspaces
      # Claude Code / Codex OAuth credentials for dsh-llm-local-token.
      # Read-write on purpose: the plugin refreshes the token near expiry and
      # writes it back to the same file the host CLI reads, so a read-only
      # mount would break refresh and eventually log the CLI out.
      - ${HOME}/.claude:/root/.claude
      - ${HOME}/.codex:/root/.codex
      # GitHub push access for the agent. The image has git but no ssh, so the
      # system gitconfig rewrites git@github.com: remotes to HTTPS and the
      # helper answers with ./secrets/github-token. The token is a file, not
      # an environment variable: the harness drops credential-shaped names
      # from every agent tool command's environment, so a GITHUB_TOKEN variable
      # would never reach the agent's own `git push`. An empty secrets/ leaves
      # git read-only against GitHub and the helper explains that at first use.
      - ./docker/git/gitconfig:/etc/gitconfig:ro
      - ./docker/git/credential-github:/usr/local/bin/git-credential-github:ro
      - ./secrets:/etc/dsh/secrets:ro
    working_dir: /workspace

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: dsh:local
    entrypoint: ["node", "/app/apps/cli/lib/bin.js"]
    command: ["web", "--no-open"]
    # Direct mode injects no DeepSeek variables; see the headless service above.
    volumes:
      - dsh-home:/root/.dsh
      - ${DSH_WORKSPACE:-.}:/workspace
      - ./workspaces:/workspaces
      # Claude Code / Codex OAuth credentials for dsh-llm-local-token.
      # Read-write on purpose: the plugin refreshes the token near expiry and
      # writes it back to the same file the host CLI reads, so a read-only
      # mount would break refresh and eventually log the CLI out.
      - ${HOME}/.claude:/root/.claude
      - ${HOME}/.codex:/root/.codex
      # GitHub push access; see the headless service above.
      - ./docker/git/gitconfig:/etc/gitconfig:ro
      - ./docker/git/credential-github:/usr/local/bin/git-credential-github:ro
      - ./secrets:/etc/dsh/secrets:ro
    working_dir: /workspace
    ports:
      # web-proxy listens on 8080 inside this service's network namespace and
      # forwards to dsh web's loopback-only 127.0.0.1:3080; see docker/proxy.
      - "127.0.0.1:3080:8080"

  # Headless HTTP API: the same POST /api/<method> surface as the web service,
  # composed without any browser UI. The `api` profile in the dsh-home volume
  # owns its plugin rows; see its cordis.patch.yml.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: dsh:local
    entrypoint: ["node", "/app/apps/cli/lib/bin.js", "--profile", "api"]
    command: []
    # Direct mode injects no DeepSeek variables; see the headless service above.
    volumes:
      - dsh-home:/root/.dsh
      - ${DSH_WORKSPACE:-.}:/workspace
      - ./workspaces:/workspaces
      # Claude Code / Codex OAuth credentials for dsh-llm-local-token.
      # Read-write on purpose: the plugin refreshes the token near expiry and
      # writes it back to the same file the host CLI reads, so a read-only
      # mount would break refresh and eventually log the CLI out.
      - ${HOME}/.claude:/root/.claude
      - ${HOME}/.codex:/root/.codex
      # GitHub push access; see the headless service above.
      - ./docker/git/gitconfig:/etc/gitconfig:ro
      - ./docker/git/credential-github:/usr/local/bin/git-credential-github:ro
      - ./secrets:/etc/dsh/secrets:ro
    working_dir: /workspace
    ports:
      # api-proxy listens on 8081 inside this service's network namespace and
      # forwards to the API server's loopback-only 127.0.0.1:3081.
      # Published on the host loopback only: /api has a reachability fence,
      # not authentication. Do not publish it on a routable address. The
      # docker-compose.raven.yml override adds a Traefik route for it; that
      # route is only as private as Traefik's own bind address.
      - "127.0.0.1:3081:8081"

  api-proxy:
    build:
      context: ./docker/proxy
    image: dsh-web-proxy:local
    command: ["TCP-LISTEN:8081,fork,reuseaddr", "TCP:127.0.0.1:3081"]
    network_mode: "service:api"
    depends_on:
      - api

  # Discord bridge for the api service (apps/discord-bot): one Discord thread
  # per harness session, approvals and questions answered from Discord. It
  # shares the api service's network namespace so it reaches the API on that
  # namespace's loopback, which passes the /api Host fence without declaring
  # a trusted host. A shared namespace shares nothing else, so the volumes it
  # needs are declared again here. The bot token is a file for the same
  # reason as the GitHub token; the allowlist is plain configuration and
  # rides .env. It exits at start when either is missing.
  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: dsh:local
    entrypoint: ["node", "/app/apps/discord-bot/lib/bin.js"]
    command: []
    network_mode: "service:api"
    depends_on:
      - api
    environment:
      DISCORD_ALLOWED_USER_IDS: ${DISCORD_ALLOWED_USER_IDS:-}
    volumes:
      - dsh-home:/root/.dsh
      - ./secrets:/etc/dsh/secrets:ro
    profiles:
      - discord

  web-proxy:
    build:
      context: ./docker/proxy
    image: dsh-web-proxy:local
    network_mode: "service:web"
    depends_on:
      - web

volumes:
  dsh-home:
